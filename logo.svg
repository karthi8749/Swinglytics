<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 80 280 200" width="100%" height="100%">
  <defs>
    <!-- Vibrant Emerald-to-Forest Linear Gradient -->
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1ee667" />
      <stop offset="25%" stop-color="#12c955" />
      <stop offset="70%" stop-color="#0ca843" />
      <stop offset="100%" stop-color="#078233" />
    </linearGradient>

    <!-- Horn Gradient with light radial shine -->
    <linearGradient id="hornGradL" x1="100%" y1="50%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0a8c38" />
      <stop offset="40%" stop-color="#12c955" />
      <stop offset="85%" stop-color="#22e86d" />
      <stop offset="100%" stop-color="#12c955" />
    </linearGradient>

    <linearGradient id="hornGradR" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a8c38" />
      <stop offset="40%" stop-color="#12c955" />
      <stop offset="85%" stop-color="#22e86d" />
      <stop offset="100%" stop-color="#12c955" />
    </linearGradient>

    <!-- Candle Body Gradient with subtle shine -->
    <linearGradient id="candleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24ea6f" />
      <stop offset="50%" stop-color="#10c753" />
      <stop offset="100%" stop-color="#088c37" />
    </linearGradient>

    <!-- Specular Highlight Overlay -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- ================= WICKS ================= -->
  <!-- Candle 1 Wick (Left Outer) -->
  <line x1="134" y1="144" x2="134" y2="222" stroke="url(#bullGrad)" stroke-width="4.5" stroke-linecap="round" />
  <!-- Candle 2 Wick (Left Inner) -->
  <line x1="165" y1="157" x2="165" y2="267" stroke="url(#bullGrad)" stroke-width="4.5" stroke-linecap="round" />
  <!-- Candle 3 Wick (Right Inner) -->
  <line x1="193" y1="157" x2="193" y2="267" stroke="url(#bullGrad)" stroke-width="4.5" stroke-linecap="round" />
  <!-- Candle 4 Wick (Right Outer) -->
  <line x1="224" y1="144" x2="224" y2="222" stroke="url(#bullGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- ================= CANDLESTICK BODIES ================= -->
  <!-- Candle 1 Body -->
  <rect x="125" y="158" width="18" height="48" rx="4.5" fill="url(#candleGrad)" />
  <path d="M 125,162.5 Q 134,172 143,162.5 L 143,158 Q 134,167.5 125,158 Z" fill="url(#shineGrad)" />

  <!-- Candle 2 Body -->
  <rect x="156" y="195" width="18" height="58" rx="4.5" fill="url(#candleGrad)" />
  <path d="M 156,200 Q 165,210 174,200 L 174,195 Q 165,205 156,195 Z" fill="url(#shineGrad)" />

  <!-- Candle 3 Body -->
  <rect x="184" y="195" width="18" height="58" rx="4.5" fill="url(#candleGrad)" />
  <path d="M 184,200 Q 193,210 202,200 L 202,195 Q 193,205 184,195 Z" fill="url(#shineGrad)" />

  <!-- Candle 4 Body -->
  <rect x="215" y="158" width="18" height="48" rx="4.5" fill="url(#candleGrad)" />
  <path d="M 215,162.5 Q 224,172 233,162.5 L 233,158 Q 224,167.5 215,158 Z" fill="url(#shineGrad)" />

  <!-- ================= HORN COLLARS & BASES ================= -->
  <!-- Left Collar & Base -->
  <rect x="110" y="154" width="10" height="20" rx="3" fill="url(#bullGrad)" />
  <rect x="105" y="146" width="5" height="36" rx="2.5" fill="url(#bullGrad)" />

  <!-- Right Collar & Base -->
  <rect x="238" y="154" width="10" height="20" rx="3" fill="url(#bullGrad)" />
  <rect x="248" y="146" width="5" height="36" rx="2.5" fill="url(#bullGrad)" />

  <!-- ================= HORNS ================= -->
  <!-- Left Horn Crescent -->
  <path d="M 105,154 
           C 90,154 78,135 99,93 
           C 72,106 54,136 56,158 
           C 58,172 75,174 105,174 
           Z" 
        fill="url(#hornGradL)" />

  <!-- Left Horn Top Highlight Arc -->
  <path d="M 99,93 
           C 75,108 60,132 60,152
           C 66,134 82,114 99,93 Z" 
        fill="url(#shineGrad)" />

  <!-- Right Horn Crescent (Mirror) -->
  <path d="M 253,154 
           C 268,154 280,135 259,93 
           C 286,106 304,136 302,158 
           C 300,172 283,174 253,174 
           Z" 
        fill="url(#hornGradR)" />

  <!-- Right Horn Top Highlight Arc (Mirror) -->
  <path d="M 259,93 
           C 283,108 298,132 298,152
           C 292,134 276,114 259,93 Z" 
        fill="url(#shineGrad)" />
</svg>
